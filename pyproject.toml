[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-recovery-platform"
version = "0.1.0"
description = "Health checks, replacement containers, and tested storage recovery for Docker services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crp = "recovery.cli:main"

[tool.setuptools]
packages = ["recovery"]
